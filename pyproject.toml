[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironveil"
version = "1.0.0"
description = "Security-first code scanner. Static analysis + LLM-powered deep review for Python, JS/TS, Java, PHP, and Go."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kanchana Wickremasinghe", email = "kanchanaw@senathltd.com"},
]
keywords = ["security", "scanner", "code-review", "llm", "sast", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]
tools = [
    "semgrep>=1.50.0",
    "trufflehog3>=3.0.0",
    "pylint>=3.0.0",
    "bandit>=1.7.0",
]
all = [
    "ironveil[llm,tools]",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ironveil = "ironveil.cli:main"
ironveil-scan = "ironveil.cli:main"

[project.entry-points."openclaw.skill"]
ironveil = "ironveil.openclaw_skill:register"

[tool.setuptools.packages.find]
include = ["ironveil*"]

[tool.ruff]
line-length = 120
target-version = "py310"
